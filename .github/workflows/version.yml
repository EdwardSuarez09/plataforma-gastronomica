name: Publicar version

# Entrega continua: al subir una etiqueta vX.Y se verifica todo y se publica la version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Empaquetar la web compilada
        run: zip -r sazon-web.zip web/dist
      - name: Crear la version en GitHub
        run: gh release create "$GITHUB_REF_NAME" sazon-web.zip --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
